apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: longhorn
      version: 1.12.2
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
      interval: 5m
  interval: 5m0s
  values:
    longhornGlobalManager:
      replicas: 3
    longhornUI:
      replicas: 2
    defaultBackupStore:
      backupTarget: cifs://10.69.1.40/snapshots/longhorn/
      backupTargetCredentialSecret: longhorn-cifs-monolith
      pollInterval: 180
    defaultSettings:
      nodeDrainPolicy: always-allow
      defaultDataPath: /mnt/k3s/longhorn
      createDefaultDiskLabeledNodes: true
      systemManagedComponentsNodeSelector: ""
    preUpgradeChecker:
      jobEnabled: true
      upgradeVersionCheck: true
    image:
      pullPolicy: Always
