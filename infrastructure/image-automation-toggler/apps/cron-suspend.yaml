---
# Apps: suspend at 04:00
apiVersion: batch/v1
kind: CronJob
metadata:
  name: suspend-cluster-apps
  namespace: flux-system
spec:
  schedule: "0 4 * * *"
  timeZone: "America/New_York"
  startingDeadlineSeconds: 1800
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: image-automation-toggler
          restartPolicy: OnFailure
          containers:
            - name: kubectl
              image: registry.k8s.io/kubectl:v1.30.0
              command:
                - kubectl
                - patch
                - imageupdateautomation
                - cluster-apps
                - -n
                - flux-system
                - --type=merge
                - -p
                - '{"spec":{"suspend":true}}'
