---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-readonly
rules:
  # Core, WITHOUT secrets, pods/exec, pods/portforward, pods/attach
  - apiGroups: [""]
    resources:
      [
        pods,
        pods/log,
        services,
        endpoints,
        events,
        namespaces,
        nodes,
        persistentvolumes,
        persistentvolumeclaims,
        configmaps,
        serviceaccounts,
        resourcequotas,
        limitranges,
      ]
    verbs: [get, list, watch]
  - apiGroups:
      [
        apps,
        batch,
        networking.k8s.io,
        storage.k8s.io,
        policy,
        autoscaling,
        discovery.k8s.io,
        apiextensions.k8s.io,
        metrics.k8s.io,
      ]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups:
      [
        source.toolkit.fluxcd.io,
        kustomize.toolkit.fluxcd.io,
        helm.toolkit.fluxcd.io,
        notification.toolkit.fluxcd.io,
        image.toolkit.fluxcd.io,
        longhorn.io,
        postgresql.cnpg.io,
      ]
    resources: ["*"]
    verbs: [get, list, watch]
