---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: profile
  namespace: cvsickle-profile
  annotations:
    kubernetes.io/ingress.class: traefik-local
spec:
  entryPoints:
    - websecure
  tls:
    secretName: local-cvsickle-com-tls
  routes:
    - match: Host(`profile.local.cvsickle.com`)
      kind: Rule
      services:
        - name: profile
          port: 8080
    - match: Host(`www.cvsickle.com`)
      kind: Rule
      services:
        - name: profile
          port: 8080
      middlewares:
        - name: default-headers
          namespace: default
    - match: Host(`cvsickle.com`)
      kind: Rule
      services:
        - name: profile
          port: 8080
      middlewares:
        - name: default-headers
          namespace: default