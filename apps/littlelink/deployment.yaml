---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: littlelink
  namespace: littlelink
  labels:
    app: littlelink
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: littlelink
  template:
    metadata:
      labels:
        app: littlelink
    spec:
      containers:
        - name: littlelink
          image: ghcr.io/timothystewart6/littlelink-server:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: littlelink
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      restartPolicy: Always