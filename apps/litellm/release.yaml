---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: litellm
spec:
  interval: 5m
  timeout: 20m
  chartRef:
    kind: OCIRepository
    name: litellm
    namespace: litellm
  values:
    # Migration
    migrationJob:
      enabled: false
    # High Availability
    replicaCount: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - litellm
                - key: batch.kubernetes.io/job-name
                  operator: DoesNotExist
            topologyKey: kubernetes.io/hostname
    pdb:
      enabled: true
      maxUnavailable: 1
    startupProbe:
      failureThreshold: 60
    # Service
    service:
      type: ClusterIP
      port: 4000
    # Configuration
    masterkeySecretName: litellm-master-key
    masterkeySecretKey: LITELLM_MASTER_KEY
    environmentSecrets:
      - litellm-master-key
      - anthropic-api-key
      - xai-api-key
    proxyConfigMap:
      create: false
      name: litellm
    # Database
    db:
      useExisting: true
      deployStandalone: false
      endpoint: cnpg-cluster-rw.cnpg-system.svc.cluster.local
      database: litellm
      secret:
        name: cnpg-litellm-auth
        usernameKey: username
        passwordKey: password
    # Disable built-in Redis
    redis:
      enabled: false
    # Use Redis standalone
    envVars:
      REDIS_HOST: litellm-redis.litellm.svc.cluster.local
      REDIS_PORT: "6379"
    # Resource Limits
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        memory: "1.5Gi"
