---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm-redis
  namespace: litellm
spec:
  interval: 5m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: redis-standalone
    namespace: redis-system
  values:
    redisStandalone:
      resources: {}
        # requests:
        #   cpu: 100m
        #   memory: 128Mi
        # limits:
        #   memory: 128Mi
    storageSpec: null
