apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom
  namespace: litellm
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: headroom
  template:
    metadata:
      labels:
        app: headroom
    spec:
      containers:
        - name: headroom
          image: ghcr.io/headroomlabs-ai/headroom:0.37.0 # {"$imagepolicy": "flux-system:headroom"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8787
          env:
            - name: HEADROOM_TELEMETRY
              value: "off"
            - name: HEADROOM_SAVINGS_PROFILE
              value: "balanced"
            - name: HEADROOM_COMPRESS_USER_MESSAGES
              value: "true"
            - name: HEADROOM_COMPRESS_ALLOW_REMOTE
              value: "true"
            - name: HEADROOM_STATELESS
              value: "true"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
      restartPolicy: Always
