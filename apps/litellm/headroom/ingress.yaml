---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headroom
  namespace: litellm
  annotations:
    kubernetes.io/ingress.class: traefik-local
spec:
  entryPoints:
    - websecure
  tls:
    secretName: local-cvsickle-com-tls
  routes:
    - match: Host(`headroom.local.cvsickle.com`)
      kind: Rule
      services:
        - name: headroom
          port: 8787