---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm
  namespace: litellm
data:
  config.yaml: |
    model_list:

      - model_name: claude-haiku-5-5
        litellm_params:
          model: anthropic/claude-haiku-5-5
          api_key: os.environ/ANTHROPIC_API_KEY
          input_cost_per_token: 0.0000001
          output_cost_per_token: 0.0000005
          thinking:
            type: adaptive
            display: summarized

      - model_name: claude-sonnet-5-5
        litellm_params:
          model: anthropic/claude-sonnet-5-5
          api_key: os.environ/ANTHROPIC_API_KEY
          input_cost_per_token: 0.000002
          output_cost_per_token: 0.000010
          thinking:
            type: adaptive
            display: summarized

      - model_name: claude-opus-5-5
        litellm_params:
          model: anthropic/claude-opus-5-5
          api_key: os.environ/ANTHROPIC_API_KEY
          input_cost_per_token: 0.000004
          output_cost_per_token: 0.000020
          thinking:
            type: adaptive
            display: summarized
      
      - model_name: claude-auto-5-5
        litellm_params:
          model: auto_router/complexity_router
          complexity_router_config:
            tiers:
              SIMPLE: claude-haiku-5-5
              MEDIUM: claude-sonnet-5-5
              COMPLEX: claude-sonnet-5-5
              REASONING: claude-opus-5-5
            classifier_type: llm
            classifier_llm_config:
              model: llama3.2
              timeout_ms: 5000
            classifier_context_window_size: 0
            classification_mode: every_request
            return_raw_model_name: true
          complexity_router_default_model: claude-sonnet-5-5
        model_info:
          mode: chat
          max_input_tokens: 1000000
          max_output_tokens: 128000
          supports_vision: true
          supports_reasoning: true
          supports_function_calling: true
          supports_prompt_caching: true
      
      - model_name: grok-build-0.1
        litellm_params:
          model: xai/grok-build-0.1
          api_key: os.environ/XAI_API_KEY
          input_cost_per_token: 0.000001
          output_cost_per_token: 0.000002

      - model_name: grok-4.7
        litellm_params:
          model: xai/grok-4.7
          api_key: os.environ/XAI_API_KEY
          input_cost_per_token: 0.000002
          output_cost_per_token: 0.000006
      
      - model_name: grok-imagine-image-2.0
        litellm_params:
          model: xai/grok-imagine-image-2.0
          api_key: os.environ/XAI_API_KEY
        model_info:
          mode: image_generation
          input_cost_per_image: 0.01
          output_cost_per_image: 0.06

      - model_name: nomic-embed-text-v2-moe
        litellm_params:
          model: ollama/nomic-embed-text-v2-moe:latest
          api_base: "http://10.69.1.52:11434"
        model_info:
          mode: embedding
      - model_name: nomic-embed-text-v2-moe
        litellm_params:
          model: ollama/nomic-embed-text-v2-moe:latest
          api_base: "http://10.69.1.70:11434"
        model_info:
          mode: embedding
      
      - model_name: llama3.2
        litellm_params:
          model: ollama_chat/llama3.2:3b
          api_base: "http://10.69.1.52:11434"
      - model_name: llama3.2
        litellm_params:
          model: ollama_chat/llama3.2:3b
          api_base: "http://10.69.1.70:11434"
      
      - model_name: minicpm-v
        litellm_params:
          model: ollama_chat/minicpm-v4.5:8b
          api_base: "http://10.69.1.52:11434"
      - model_name: minicpm-v
        litellm_params:
          model: ollama_chat/minicpm-v4.5:8b
          api_base: "http://10.69.1.70:11434"

      - model_name: ornith
        litellm_params:
          model: ollama_chat/robit/ornith-vision:9b
          api_base: "http://10.69.1.52:11434"
        model_info:
          mode: chat
          max_input_tokens: 229376
          max_output_tokens: 32768
          supports_vision: true
          supports_reasoning: true
          supports_function_calling: true
          supports_prompt_caching: false
      - model_name: ornith
        litellm_params:
          model: ollama_chat/robit/ornith-vision:9b
          api_base: "http://10.69.1.70:11434"
        model_info:
          mode: chat
          max_input_tokens: 229376
          max_output_tokens: 32768
          supports_vision: true
          supports_reasoning: true
          supports_function_calling: true
          supports_prompt_caching: false

      - model_name: ornith-1.5
        litellm_params:
          model: ollama_chat/smtek/ornith-1.5:9b
          api_base: "http://10.69.1.52:11434"
        model_info:
          mode: chat
          max_input_tokens: 114688
          max_output_tokens: 16384
          supports_vision: true
          supports_reasoning: true
          supports_function_calling: true
          supports_prompt_caching: false
      - model_name: ornith-1.5
        litellm_params:
          model: ollama_chat/smtek/ornith-1.5:9b
          api_base: "http://10.69.1.70:11434"
        model_info:
          mode: chat
          max_input_tokens: 114688
          max_output_tokens: 16384
          supports_vision: true
          supports_reasoning: true
          supports_function_calling: true
          supports_prompt_caching: false

    general_settings:
      store_model_in_db: False
      store_prompts_in_spend_logs: True
      user_header_mappings:
        - header_name: X-OpenWebUI-User-Id
          litellm_user_role: internal_user
        - header_name: X-OpenWebUI-User-Email
          litellm_user_role: customer

    litellm_settings:
      drop_params: True
      modify_params: True
      enable_anthropic_prompt_caching: true
      cache: True
      cache_params:
        type: redis
        host: litellm-redis-master.litellm.svc.cluster.local
        port: 6379
        
    router_settings:
      routing_strategy: simple-shuffle
      redis_host: litellm-redis-master.litellm.svc.cluster.local
      redis_port: 6379

    guardrails:
      - guardrail_name: headroom-compression
        litellm_params:
          guardrail: headroom
          mode: pre_call
          api_base: http://headroom.litellm.svc.cluster.local:8787
          default_on: true
