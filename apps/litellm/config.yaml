---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm
  namespace: litellm
data:
  config.yaml: |
    model_list:

      - model_name: claude-haiku-4-5
        litellm_params:
          model: anthropic/claude-haiku-4-5
          api_key: os.environ/ANTHROPIC_API_KEY
          reasoning_effort: low
          max_tokens: 32000
          input_cost_per_token: 0.000001
          output_cost_per_token: 0.000005
        model_info:
          health_check_max_tokens: 2048

      - model_name: claude-sonnet-4-5
        litellm_params:
          model: anthropic/claude-sonnet-4-5
          api_key: os.environ/ANTHROPIC_API_KEY
          reasoning_effort: medium
          max_tokens: 64000
          input_cost_per_token: 0.000003
          output_cost_per_token: 0.000015
        model_info:
          health_check_max_tokens: 4096
      - model_name: claude-sonnet-4-6
        litellm_params:
          model: anthropic/claude-sonnet-4-6
          api_key: os.environ/ANTHROPIC_API_KEY
          reasoning_effort: medium
          input_cost_per_token: 0.000003
          output_cost_per_token: 0.000015
      - model_name: claude-sonnet-5
        litellm_params:
          model: anthropic/claude-sonnet-5
          api_key: os.environ/ANTHROPIC_API_KEY
          reasoning_effort: medium
          input_cost_per_token: 0.000002
          output_cost_per_token: 0.000010
          thinking:
            type: adaptive
            display: summarized
      - model_name: claude-sonnet-5-low
        litellm_params:
          model: anthropic/claude-sonnet-5
          api_key: os.environ/ANTHROPIC_API_KEY
          reasoning_effort: low
          input_cost_per_token: 0.000002
          output_cost_per_token: 0.000010
          thinking:
            type: adaptive
            display: summarized

      - model_name: claude-opus-4-5
        litellm_params:
          model: anthropic/claude-opus-4-5
          api_key: os.environ/ANTHROPIC_API_KEY
          reasoning_effort: medium
          max_tokens: 64000
          input_cost_per_token: 0.000005
          output_cost_per_token: 0.000025
        model_info:
          health_check_max_tokens: 4096
      - model_name: claude-opus-4-6
        litellm_params:
          model: anthropic/claude-opus-4-6
          api_key: os.environ/ANTHROPIC_API_KEY
          reasoning_effort: medium
          input_cost_per_token: 0.000005
          output_cost_per_token: 0.000025
      - model_name: claude-opus-4-8
        litellm_params:
          model: anthropic/claude-opus-4-8
          api_key: os.environ/ANTHROPIC_API_KEY
          input_cost_per_token: 0.000005
          output_cost_per_token: 0.000025
          thinking:
            type: adaptive
            display: summarized
      - model_name: claude-opus-5
        litellm_params:
          model: anthropic/claude-opus-5
          api_key: os.environ/ANTHROPIC_API_KEY
          input_cost_per_token: 0.000005
          output_cost_per_token: 0.000025
          thinking:
            type: adaptive
            display: summarized
      - model_name: claude-opus-5-low
        litellm_params:
          model: anthropic/claude-opus-5
          api_key: os.environ/ANTHROPIC_API_KEY
          reasoning_effort: low
          input_cost_per_token: 0.000005
          output_cost_per_token: 0.000025
          thinking:
            type: adaptive
            display: summarized
      
      - model_name: claude-auto-4-5
        litellm_params:
          model: auto_router/complexity_router
          complexity_router_config:
            tiers:
              SIMPLE: claude-haiku-4-5
              MEDIUM: claude-sonnet-4-5
              COMPLEX: claude-sonnet-4-5
              REASONING: claude-opus-4-5
            classifier_type: heuristic
            classifier_context_window_size: 0
          complexity_router_default_model: claude-sonnet-4-5
      - model_name: claude-auto-5
        litellm_params:
          model: auto_router/complexity_router
          complexity_router_config:
            tiers:
              SIMPLE: claude-haiku-4-5
              MEDIUM: claude-sonnet-5-low
              COMPLEX: claude-opus-5-low
              REASONING: claude-opus-5
            classifier_type: heuristic
            classifier_context_window_size: 0
          complexity_router_default_model: claude-sonnet-5-low

      - model_name: nomic-embed-text-v2-moe
        litellm_params:
          model: ollama/nomic-embed-text-v2-moe:latest
          api_base: "http://10.69.1.52:11434"
        model_info:
          mode: embedding
      - model_name: nomic-embed-text-v2-moe
        litellm_params:
          model: ollama/nomic-embed-text-v2-moe:latest
          api_base: "http://10.69.1.70:11434"
        model_info:
          mode: embedding
      
      - model_name: llama3.2
        litellm_params:
          model: ollama_chat/llama3.2:3b
          api_base: "http://10.69.1.52:11434"
      - model_name: llama3.2
        litellm_params:
          model: ollama_chat/llama3.2:3b
          api_base: "http://10.69.1.70:11434"
      
      - model_name: minicpm-v
        litellm_params:
          model: ollama_chat/minicpm-v4.5:8b
          api_base: "http://10.69.1.52:11434"
      - model_name: minicpm-v
        litellm_params:
          model: ollama_chat/minicpm-v4.5:8b
          api_base: "http://10.69.1.70:11434"

      - model_name: ornith
        litellm_params:
          model: ollama_chat/robit/ornith-vision:9b
          api_base: "http://10.69.1.52:11434"
      - model_name: ornith
        litellm_params:
          model: ollama_chat/robit/ornith-vision:9b
          api_base: "http://10.69.1.70:11434"

      - model_name: ornith-1.5
        litellm_params:
          model: ollama_chat/smtek/ornith-1.5:9b
          api_base: "http://10.69.1.52:11434"
      - model_name: ornith-1.5
        litellm_params:
          model: ollama_chat/smtek/ornith-1.5:9b
          api_base: "http://10.69.1.70:11434"

    general_settings:
      store_model_in_db: False
      store_prompts_in_spend_logs: True
      user_header_mappings:
        - header_name: X-OpenWebUI-User-Id
          litellm_user_role: internal_user
        - header_name: X-OpenWebUI-User-Email
          litellm_user_role: customer

    litellm_settings:
      drop_params: True
      modify_params: True
      enable_anthropic_prompt_caching: true
      cache: True
      cache_params:
        type: redis
        host: litellm-redis-master.litellm.svc.cluster.local
        port: 6379
        
    router_settings:
      routing_strategy: simple-shuffle
      redis_host: litellm-redis-master.litellm.svc.cluster.local
      redis_port: 6379
    
    guardrails:
      - guardrail_name: headroom-compression
        litellm_params:
          guardrail: headroom
          mode: pre_call
          api_base: http://headroom.litellm.svc.cluster.local:8787
          default_on: true
