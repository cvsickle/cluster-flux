---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr
  namespace: default
  annotations:
    kubernetes.io/ingress.class: traefik-local
spec:
  entryPoints:
    - websecure
  tls:
    secretName: local-cvsickle-com-tls
  routes:
    - match: Host(`sonarr.local.cvsickle.com`)
      kind: Rule
      services:
        - name: sonarr
          namespace: external-apps
          port: 32783
